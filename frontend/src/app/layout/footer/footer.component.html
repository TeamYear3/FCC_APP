<footer class="w-full bg-[#161616] border-t border-white/10 px-6 py-3 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-color-text-secondary select-none shrink-0" data-testid="app-footer">
  <div class="flex items-center gap-2">
    <span class="font-bold text-color-primary-accent tracking-wider uppercase">FCC Taller</span>
    <span class="text-gray-500">|</span>
    <span>&copy; {{ currentYear }} Todos los derechos reservados</span>
  </div>
  <div class="flex items-center gap-2 font-mono text-[11px] text-gray-400" data-testid="footer-app-version">
    <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse" title="Sistema Operativo"></span>
    <span>Versión {{ appVersion }}</span>
  </div>
</footer>
