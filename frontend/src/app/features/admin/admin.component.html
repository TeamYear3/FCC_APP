<div class="flex h-screen bg-color-bg-main overflow-hidden text-white font-sans">
  <!-- Fondo translúcido móvil para cerrar al hacer clic fuera (Drawer Overlay) -->
  @if (sidebarService.isSidebarOpen()) {
    <div (click)="sidebarService.closeSidebar()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 md:hidden"></div>
  }

  <!-- Barra lateral (Sidebar) -->
  <app-sidebar 
    [class.translate-x-0]="sidebarService.isSidebarOpen()"
    [class.-translate-x-full]="!sidebarService.isSidebarOpen()"
    class="fixed inset-y-0 left-0 w-64 z-50 md:relative md:translate-x-0 transition-transform duration-300 ease-in-out block flex-shrink-0"
  ></app-sidebar>
  
  <!-- Contenedor principal para Navbar y Contenido -->
  <div class="flex flex-col flex-1 overflow-hidden">
    <!-- Banner Flotante de Advertencia del Modo Vista Previa de Rol -->
    @if (sidebarService.vistaPreviaRolSignal()) {
      <div class="bg-yellow-500/20 border-b border-yellow-500/40 text-yellow-300 px-6 py-2.5 flex items-center justify-between z-30 shadow-inner backdrop-blur-md">
        <div class="flex items-center gap-2 text-xs font-semibold">
          <svg class="w-4 h-4 text-yellow-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
          <span>Estás navegando en modo <strong>Vista Previa de Rol ({{ sidebarService.vistaPreviaRolSignal() | uppercase }})</strong>. Tu sesión de Administrador sigue activa.</span>
        </div>
        <button 
          type="button" 
          (click)="sidebarService.salirVistaPrevia()" 
          class="px-3 py-1 rounded-full bg-yellow-500 text-black font-bold text-xs hover:bg-yellow-400 active:scale-95 transition-all shadow cursor-pointer flex items-center gap-1"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
          Salir de vista previa
        </button>
      </div>
    }

    <!-- Barra superior (Navbar) -->
    <app-navbar></app-navbar>
    
    <!-- Contenedor scrollable para subrutas -->
    <main class="flex-1 overflow-y-auto p-6 bg-color-bg-main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
