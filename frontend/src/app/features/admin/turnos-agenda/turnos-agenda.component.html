<div class="p-6 bg-color-surface-container rounded-card border border-white/5 shadow relative">
  
  <!-- Loader indicador de carga -->
  <div *ngIf="cargando()" class="absolute inset-0 bg-black/50 z-50 flex items-center justify-center rounded-card">
    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-color-primary-accent"></div>
  </div>

  <div class="flex items-center justify-between mb-6">
    <div>
      <h2 class="text-xl font-bold text-color-primary-accent uppercase tracking-wider">Agenda / Turnos</h2>
      <p class="text-sm text-color-text-secondary">Visualizá y gestioná la programación de turnos de servicio en el taller.</p>
    </div>
  </div>

  <div class="calendar-container bg-black/40 rounded-lg p-4 border border-white/5">
    <full-calendar [options]="calendarOptions()"></full-calendar>
  </div>

  <!-- MODAL DE ALTA DE TURNO (MOCK FORMULARIO) -->
  <div *ngIf="mostrarModalCrear()" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
    <div class="bg-color-surface-container border border-white/10 rounded-card shadow-2xl max-w-md w-full overflow-hidden transition-all duration-300 transform scale-100">
      
      <div class="p-6 border-b border-white/5">
        <h3 class="text-lg font-bold text-color-primary-accent uppercase">Agendar Nuevo Turno</h3>
        <p class="text-xs text-color-text-secondary">Completá los datos para asignar un turno de revisión.</p>
      </div>

      <form [formGroup]="turnoForm" class="p-6 space-y-4">
        
        <!-- Cliente -->
        <div>
          <label class="block text-xs font-semibold text-color-text-secondary uppercase mb-1">Cliente</label>
          <select 
            formControlName="cliente" 
            (change)="onClienteChange(turnoForm.get('cliente')?.value)"
            class="w-full bg-black/40 border border-white/10 rounded px-3 py-2 text-sm text-color-text-primary focus:outline-none focus:border-color-primary-accent">
            <option value="">Seleccione un cliente...</option>
            <option *ngFor="let cliente of clientes()" [value]="cliente.id">
              {{ cliente.nombre }} {{ cliente.apellido }} ({{ cliente.dni_cuit }})
            </option>
          </select>
        </div>

        <!-- Vehículo -->
        <div>
          <label class="block text-xs font-semibold text-color-text-secondary uppercase mb-1">Vehículo</label>
          <select 
            formControlName="vehiculo"
            [disabled]="!turnoForm.get('cliente')?.value"
            class="w-full bg-black/40 border border-white/10 rounded px-3 py-2 text-sm text-color-text-primary focus:outline-none focus:border-color-primary-accent disabled:opacity-50 disabled:cursor-not-allowed">
            <option value="">Seleccione un vehículo...</option>
            <option *ngFor="let vehiculo of vehiculosFiltrados()" [value]="vehiculo.id">
              {{ vehiculo.marca }} {{ vehiculo.modelo }} ({{ vehiculo.patente }})
            </option>
          </select>
          <p *ngIf="!turnoForm.get('cliente')?.value" class="text-[10px] text-yellow-500/80 mt-1">
            * Debe seleccionar un cliente primero para cargar sus vehículos.
          </p>
        </div>

        <!-- Fecha y Hora -->
        <div>
          <label class="block text-xs font-semibold text-color-text-secondary uppercase mb-1">Fecha y Hora</label>
          <input 
            type="datetime-local" 
            formControlName="fecha_hora"
            class="w-full bg-black/40 border border-white/10 rounded px-3 py-2 text-sm text-color-text-primary focus:outline-none focus:border-color-primary-accent" />
        </div>

        <!-- Motivo de Ingreso -->
        <div>
          <label class="block text-xs font-semibold text-color-text-secondary uppercase mb-1">Motivo / Síntomas</label>
          <textarea 
            formControlName="motivo" 
            rows="2"
            placeholder="Describa el motivo del turno (ej. Service 10k, ruido en frenos...)"
            class="w-full bg-black/40 border border-white/10 rounded px-3 py-2 text-sm text-color-text-primary focus:outline-none focus:border-color-primary-accent"></textarea>
        </div>

        <!-- Botones de Acción -->
        <div class="flex items-center justify-end space-x-3 pt-4 border-t border-white/5">
          <button 
            type="button" 
            (click)="cerrarModalCrear()"
            class="px-4 py-2 text-xs font-semibold text-color-text-secondary hover:text-color-text-primary uppercase tracking-wider transition-colors duration-200">
            Cancelar
          </button>
          <button 
            type="button"
            [disabled]="turnoForm.invalid"
            class="px-5 py-2 text-xs font-bold bg-color-primary-accent text-black rounded uppercase tracking-wider hover:bg-opacity-80 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
            Guardar Reserva
          </button>
        </div>

      </form>
    </div>
  </div>

</div>
